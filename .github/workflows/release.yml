name: Release

# Publish-on-tag (ADR-0016 Decision 6): tagging v* runs ALL trust gates as a HARD
# precondition, then `changeset publish` pushes any package whose version isn't yet
# on npm. Inert-safe: without the NPM_TOKEN secret the gates still run and publish
# skips cleanly (so the workflow can land before the scope is claimed — see
# Docs/plans phase2 human-action checklist).
#
# The gates are NOT copied here anymore: this workflow CALLS ci.yml as a reusable
# workflow (GOV-6 / corrections C3), so the exact gates+visual+a11y jobs that guard
# every PR also guard publishing, and can never drift. Add a gate step in ci.yml and
# it automatically becomes a publish precondition.
#
# Release flow:
#   1. `npm run version`  -> consumes changesets, bumps @tensor_1/tokens + @tensor_1/react
#      (linked), regenerates CHANGELOGs. Commit.
#   2. tag `vX.Y.Z` + push -> this workflow. `publish` only runs if the called CI passes.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  # ── hard publish precondition — run the SAME gates as every PR (reusable ci.yml) ──
  ci:
    uses: ./.github/workflows/ci.yml

  # ── publish only after every gate is green ─────────────────────────────────────
  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build:all
      # build:all's inner react `npm ci` prunes root devDeps (incl. @changesets/cli) —
      # restore them so `npx changeset publish` can resolve the executable.
      - run: npm ci

      - name: Publish (inert without NPM_TOKEN)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN not set — gates passed, skipping publish. Set the secret to enable real publishing."
            exit 0
          fi
          npx changeset publish
