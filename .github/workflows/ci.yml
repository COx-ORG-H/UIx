name: CI

# Trust gates for every PR + default-branch push (ADR-0016 Decision 6). The same
# gates are a hard precondition for publishing (see release.yml). Keep this list and
# the release preconditions in sync.

on:
  pull_request:
  push:
    branches: [master]
  # Callable as a reusable workflow so release.yml runs THESE exact gate jobs as
  # its publish precondition (GOV-6 / corrections C3) — instead of a hand-kept copy
  # that silently drifts. Any gate step added here automatically gates publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Public OSS repo -> free GitHub-hosted runner. Swap for the COx self-hosted
    # label (ADR-0006/0008) if the org pool is preferred.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspace)
        run: npm ci

      - name: Build all (tokens + themes + styles + react)
        run: npm run build:all

      # DTCG-2: token SOURCE is structurally valid vs the ADR-0019 ratified $type set. Reads JSON
      # only (never rebuilds), so it is parity-neutral. Mirrored to publishing via release.yml (GOV-6).
      - name: DTCG validity
        run: npm run test:dtcg -w @tensor_1/tokens

      - name: Token value parity
        run: npm run test:parity

      - name: Contract completeness
        run: npm run test:contract

      - name: Public API lock (@tensor_1/react)
        run: npm run test:api

      # A11Y-2: every exported React component carries a maturity status (draft|beta|stable);
      # "stable" requires a committed manual-SR result. Mirrored to publishing via release.yml (GOV-6).
      - name: Component maturity status
        run: npm run test:a11y-status

      # DIST-2: the copy-in registry manifest is regenerated-and-diffed against the shipped CSS.
      - name: Registry manifest up-to-date
        run: npm run test:registry

      - name: Per-consumer smoke build
        run: npm run test:smoke

  size:
    # PERF-1: published-bundle budgets. A SEPARATE job (not gates) because it needs the react
    # workspace devDeps (size-limit) that build:all's inner `npm ci` prunes. Owns ALL size CI
    # wiring — React budgets (test:size) AND per-CSS-file budgets (test:size:css, PERF-2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspace)
        run: npm ci

      # tokens build → build/css (test:size:css baseline); react build → dist (test:size).
      - name: Build styleguide CSS (tokens)
        run: npm run build

      # tsup directly (NOT build:react) so the root-hoisted size-limit isn't pruned by an inner npm ci.
      - name: Build react (dist)
        run: npm run build -w @tensor_1/react

      - name: React bundle budgets (size-limit + no-echarts)
        run: npm run test:size

      - name: Per-CSS-file size budgets
        run: npm run test:size:css

  react-a11y:
    # A11Y-3: jest-axe over RENDERED React components (jsdom). SEPARATE job — needs the react
    # workspace test devDeps (vitest, @testing-library, jest-axe, react 18) that build:all's inner
    # npm ci prunes. Vitest transforms the TSX source directly, so no build step is required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspace)
        run: npm ci

      - name: A11y (jest-axe) over React components
        run: npm run test:a11y-react

  visual:
    # Visual regression over the static styleguide (ADR-0016 Decision 6 — S5). Runs in the
    # PINNED Playwright container so the goldens render identically wherever they are
    # (re)generated — this job, the update-visual-goldens workflow, or `docker run` locally.
    # Committed goldens are the *-linux.png files; bootstrap them once via update-visual-goldens.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install (workspace)
        run: npm ci

      # tokens build only (regenerates build/css for the static styleguide). NOT build:all:
      # its inner `cd packages/react && npm ci` reconciles the workspace and prunes the root
      # devDeps (playwright, serve) that the next step needs.
      - name: Build styleguide CSS (tokens)
        run: npm run build

      - name: Visual regression (Playwright)
        run: npm run test:visual

      - name: Upload VR report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  a11y:
    # Accessibility gate (ADR-0016 Decision 6 — S6). axe-core over the static styleguide in
    # light + dark. Fails on serious/critical WCAG 2.1 A/AA violations; the two design-level
    # rules (color-contrast, link-in-text-block) are calibrated in the spec with a follow-up.
    # DOM-rule based, so OS-independent — plain ubuntu-latest + a chromium install (no pinned
    # container needed, unlike VR).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspace)
        run: npm ci

      # tokens build only (static styleguide CSS). NOT build:all — its inner react `npm ci`
      # prunes the root devDeps (playwright, serve) the a11y run needs.
      - name: Build styleguide CSS (tokens)
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe)
        run: npm run test:a11y

      - name: Upload a11y report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7
