name: CI

# Trust gates for every PR + default-branch push (ADR-0016 Decision 6). The same
# gates are a hard precondition for publishing (see release.yml). Keep this list and
# the release preconditions in sync.

on:
  pull_request:
  # The merge queue: each queued PR is tested as master + the PRs ahead of it + itself, so two PRs
  # that pass alone but break together stop in the queue instead of turning master red.
  merge_group:
  push:
    branches: [master]
  # Callable as a reusable workflow so release.yml runs THESE exact gate jobs as
  # its publish precondition (GOV-6 / corrections C3) — instead of a hand-kept copy
  # that silently drifts. Any gate step added here automatically gates publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Public OSS repo -> free GitHub-hosted runner. Swap for the COx self-hosted
    # label (ADR-0006/0008) if the org pool is preferred.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspace)
        run: npm ci

      - name: Build all (tokens + themes + styles + react)
        run: npm run build:all

      # tsup exits 0 without looking at what is left in dist/: a config's `clean` once deleted
      # the CJS bundles the other config had just written. The build runs this check itself;
      # it is a step of its own so a missing entry is named here, not as ENOENT in a later gate.
      - name: React dist has every exports target
        run: npm run test:dist

      - name: React behavior tests
        run: npm test -w @tensor_1/react

      - name: React typecheck
        run: npm run typecheck -w @tensor_1/react

      - name: Table runtime budget
        run: npm run test:performance

      # The chart entries' hard limits, then the main entry's baseline budget
      # (packages/react/etc/entry-size.baseline.json; Docs/performance-lanes.md).
      - name: Bundle budgets (chart entries, main entry)
        run: npm run test:size

      - name: Token value parity
        run: npm run test:parity

      - name: Contract completeness
        run: npm run test:contract

      # Per-file CSS budget plus the bundle-to-inputs ratio. The bundles it reads come from the
      # build step above: build/css/styles.css and components.css are not committed.
      - name: CSS size budget
        run: npm run test:size:css

      # Token behaviour tests, including the computed contrast of selected-chip text
      # for every theme in light and dark (no specimen renders a chip pre-selected,
      # so the a11y job cannot see that state).
      - name: Token tests
        run: npm run test:tokens

      - name: Public API lock (@tensor_1/react)
        run: npm run test:api

      # When the API report check fails, the reports it generated are here: download, compare,
      # and copy into packages/react/etc/ if the change is intended (npm run test:api:update).
      - name: Upload generated API reports (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: packages/react/temp/*.api.md
          retention-days: 7

      - name: Per-consumer smoke build
        run: npm run test:smoke

  visual:
    # Visual regression over the static styleguide (ADR-0016 Decision 6 — S5). Runs in the
    # PINNED Playwright container so the goldens render identically wherever they are
    # (re)generated — this job, the update-visual-goldens workflow, or `docker run` locally.
    # Committed goldens are the *-linux.png files; bootstrap them once via update-visual-goldens.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install (workspace)
        run: npm ci

      # tokens build only (regenerates build/css for the static styleguide). NOT build:all:
      # its inner `cd packages/react && npm ci` reconciles the workspace and prunes the root
      # devDeps (playwright, serve) that the next step needs.
      - name: Build styleguide CSS (tokens)
        run: npm run build

      - name: Visual regression (Playwright)
        run: npm run test:visual

      - name: Upload VR report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  select-cross-browser:
    # The Select listbox's keyboard, focus and placement in Chromium, Firefox and WebKit
    # (HAR-1572), the stat tiles of one stretched row (HAR-1753: how a <button> lays out as
    # a flex container is engine-specific), and the four 2.42.0 kit changes (HAR-2417: the
    # description list, the discard step, the search bar, the shortcut hints), the view transitions
    # of useViewTransition with the no-API fallback (engine support differs), and the scroll edges
    # (scroll timelines where an engine has them, the static fallback where not), and the sticky-layer
    # focus offsets (WCAG 2.2 SC 2.4.11: each engine scrolls a focused element into view its own way).
    # The list is
    # CROSS_BROWSER_SPECS in playwright.config.mjs. The pinned Playwright container ships all
    # three engines and their system libraries, so no browser download or apt step can flake here.
    # The job keeps its name: branch protection may list it.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install (workspace)
        run: npm ci

      - name: Build styleguide CSS (tokens)
        run: npm run build

      - name: Select, stat row, description list, discard step, search bar, shortcuts, view transitions and scroll edges in Chromium, Firefox and WebKit
        env:
          UIX_CROSS_BROWSER: '1'
          # Firefox refuses a HOME it does not own; the container runs as root (Playwright's CI docs).
          HOME: /root
        run: npx playwright test tests/a11y/select.spec.mjs tests/a11y/stat-row.spec.mjs tests/a11y/description-list.spec.mjs tests/a11y/discard-prompt.spec.mjs tests/a11y/search-bar.spec.mjs tests/a11y/shortcut.spec.mjs tests/a11y/view-transition.spec.mjs tests/a11y/scroll-edge.spec.mjs tests/a11y/sticky-focus.spec.mjs --project=chromium --project=firefox --project=webkit

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: select-cross-browser-report
          path: playwright-report/
          retention-days: 7

  perf:
    # Roadmap #22: a 10,000-row DataWorkspace rendered by React in a real Chromium at 4× CPU
    # throttling — mount, scroll 1,000 rows, sort, select all, search keystrokes — each interaction
    # timed as INP times it (input to next paint). Fails when a median passes its budget in
    # tests/perf/budgets.json, after one more set of runs. It runs beside the other jobs, so it adds
    # little to a PR's wall time. The no-GPU lane is nightly (perf-nightly.yml), not here.
    # Budgets and how to read the report: Docs/performance-lanes.md.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspace)
        run: npm ci

      # tokens build only (the harness's stylesheet); the harness bundles the components from source.
      - name: Build styleguide CSS (tokens)
        run: npm run build

      # No --with-deps (see the a11y job): the runner image ships Chromium's libraries.
      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Perf gate arithmetic
        run: node --test tests/perf/stats.test.mjs

      - name: DataWorkspace render benchmark (10,000 rows, 4× CPU)
        run: npm run test:perf:workspace

      - name: Upload perf report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report/
          retention-days: 30

  a11y-shard:
    # Accessibility gate (ADR-0016 Decision 6 — S6). axe-core over the static styleguide in
    # light + dark. Fails on serious/critical WCAG 2.1 A/AA violations; the two design-level
    # rules (color-contrast, link-in-text-block) are calibrated in the spec with a follow-up.
    # DOM-rule based, so OS-independent — plain ubuntu-latest + a chromium install (no pinned
    # container needed, unlike VR).
    #
    # Split into 4 shards that run at once: as one job the browser suite took 29 minutes, the
    # longest check by far, and every PR runs it twice (on the PR and in the merge queue). The
    # one-off steps (the node tests, packed contrast, the repeat of changed specs, docs coverage)
    # run in shard 1 only. The `a11y` job below is the required check: it passes when all pass.
    name: a11y (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # depth 2: on a pull_request the checkout is GitHub's merge commit, and HEAD^1 (master's tip)
      # is what "the specs this PR adds or changes" is measured against (the repeat step below)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspace)
        run: npm ci

      # tokens build only (static styleguide CSS). NOT build:all — its inner react `npm ci`
      # prunes the root devDeps (playwright, serve) the a11y run needs.
      - name: Build styleguide CSS (tokens)
        run: npm run build

      # No --with-deps: it runs apt-get update, which fails whenever a third-party apt source
      # baked into the runner image (Google Chrome) is mid-publish (Hash Sum mismatch, 2026-09-09
      # x3). The ubuntu-latest image already ships Chromium's system libraries.
      - name: Install Playwright chromium
        run: npx playwright install chromium

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ matrix.shard == 1 }}
        with:
          bun-version: '1.4.4'

      - name: Check packed token contrast in Chromium
        if: ${{ matrix.shard == 1 }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uix-packed"
          archive=$(cd packages/tokens && bun pm pack --quiet --ignore-scripts --destination "$RUNNER_TEMP")
          tar -xzf "$archive" -C "$RUNNER_TEMP/uix-packed"
          UIX_PACKED_TOKENS="$RUNNER_TEMP/uix-packed/package" node --test tests/smoke-consumer/packed-contrast.test.mjs

      - name: Accessibility source checks (spec lint, results, contrast)
        if: ${{ matrix.shard == 1 }}
        run: npm run test:a11y:node

      - name: Accessibility (axe), shard ${{ matrix.shard }} of 4
        run: npm run test:a11y:browser -- --shard=${{ matrix.shard }}/4

      # A test that failed and then passed on its retry is green but racy: name each one on the run.
      - name: Report tests that passed only on retry
        if: ${{ !cancelled() }}
        run: node tests/report-flaky.mjs test-results/playwright-results.json

      # A new or changed spec runs 5 more times with no retry, so a race shows up in its own PR
      # instead of in the next PR that happens to be unlucky. Skipped on the merge queue (the PR
      # already did it) and when a PR touches more than 10 specs (a mechanical sweep).
      - name: Repeat new and changed specs (flake check)
        if: ${{ matrix.shard == 1 && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          specs=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'tests/a11y/*.spec.mjs')
          count=$(printf '%s' "$specs" | grep -c . || true)
          if [ "$count" -eq 0 ]; then echo "no new or changed specs"; exit 0; fi
          if [ "$count" -gt 10 ]; then echo "::notice::$count specs changed; skipping the 5x repeat (a sweep, not new tests)"; exit 0; fi
          echo "repeating $count spec(s) 5x:"; echo "$specs"
          npx playwright test $specs --project=light --repeat-each=5 --retries=0 --reporter=list

      - name: Component documentation coverage and interactions
        if: ${{ matrix.shard == 1 }}
        run: |
          node --test packages/tokens/docs/docs.test.js packages/tokens/guide/app.test.js
          node tests/docs/verify-components.mjs

      - name: Upload a11y report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The required check (branch protection and the merge queue name `a11y`): green only when every
  # shard is. `always()` so a failed or cancelled shard turns this red instead of skipping it,
  # which a required check would otherwise count as passed.
  a11y:
    needs: a11y-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All accessibility shards passed
        run: test "${{ needs.a11y-shard.result }}" = "success"
