<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File kit harness — UIx v2</title>
  <!-- Test harness for tests/a11y/file-kit.spec.mjs. Offline: no external fonts or assets. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('uix-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../../packages/tokens/build/css/styles.css">
  <style>
    body { margin: 0; padding: var(--uix-space-5); background: var(--uix-bg-app); color: var(--uix-text); }
    main { display: grid; gap: var(--uix-space-6); max-width: 76rem; margin: 0 auto; }
    .panel { width: 340px; max-width: 100%; display: grid; gap: var(--uix-space-3); padding: var(--uix-space-4); border: 1px solid var(--uix-border); border-radius: var(--uix-radius-lg); background: var(--uix-surface); }
    .icons { display: flex; flex-wrap: wrap; gap: var(--uix-space-5); align-items: end; }
    .controls { display: flex; flex-wrap: wrap; gap: var(--uix-space-2); }
  </style>
</head>
<body>
  <main id="root"><p>Loading the harness…</p></main>
  <script type="module" src="dist/harness.js"></script>
</body>
</html>
