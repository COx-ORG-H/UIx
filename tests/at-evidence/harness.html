<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistive-technology evidence harness — UIx v2</title>
  <!-- One page holding the six widgets of Docs/a11y/scripts/*.md, for tests/a11y/at-evidence.spec.mjs
       and for a human screen-reader pass. Offline: no external fonts or assets.
       Build: node tests/at-evidence/build.mjs, then serve the repo root (npm run serve) and open
       /tests/at-evidence/harness.html. English kit defaults, so the scripts' expected words are the
       words a tester hears. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('uix-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../../packages/tokens/build/css/styles.css">
  <style>
    body { margin: 0; padding: var(--uix-space-4); background: var(--uix-bg-app); color: var(--uix-text); }
    main { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--uix-space-8); max-width: 64rem; margin: 0 auto; }
    section { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--uix-space-3); }
    h1, h2 { overflow-wrap: anywhere; }
    .row { display: flex; flex-wrap: wrap; gap: var(--uix-space-2); align-items: center; }
  </style>
</head>
<body>
  <main id="root"><p>Loading the harness…</p></main>
  <script type="module" src="dist/harness.js"></script>
</body>
</html>
