<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance harness — UIx v2</title>
  <!-- Harness for the performance lanes (tests/perf/bench.mjs). Offline: no external fonts or assets.
       ?scene=workspace (default): a 10,000-row DataWorkspace, mounted on demand by window.__perf.mount().
       ?scene=overlays: Modal and Drawer over a busy page (the scrim blur), a soft-edged scroll list
       (scroll-edge.css) and a TaskTray with five tasks. &transparency=reduce sets data-transparency. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      if (q.get('transparency') === 'reduce') document.documentElement.setAttribute('data-transparency', 'reduce');
    })();
  </script>
  <link rel="stylesheet" href="../../packages/tokens/build/css/styles.css">
  <style>
    body { margin: 0; padding: var(--uix-space-4); background: var(--uix-bg-app); color: var(--uix-text); }
    main { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--uix-space-4); max-width: 80rem; margin: 0 auto; }
    .perf-row { display: flex; flex-wrap: wrap; gap: var(--uix-space-2); }
    .perf-list { height: 24rem; overflow-y: auto; border-radius: var(--uix-radius-md); background: var(--uix-surface); }
    .perf-list p { margin: 0; padding: var(--uix-space-2) var(--uix-space-3); border-bottom: 1px solid var(--uix-border); }
    .perf-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: var(--uix-space-3); }
  </style>
</head>
<body>
  <main id="root"></main>
  <script type="module" src="dist/harness.js"></script>
</body>
</html>
