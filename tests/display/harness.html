<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display components harness — UIx v2</title>
  <!-- Test harness for the display-component specs in tests/a11y/ (HAR-1251, HAR-1253, HAR-1379,
       HAR-1370, HAR-986, HAR-1254). ?case=<name> picks the section. Offline: no external fonts or assets. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('uix-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../../packages/tokens/build/css/styles.css">
  <style>
    body { margin: 0; padding: var(--uix-space-4); background: var(--uix-bg-app); color: var(--uix-text); }
    main { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--uix-space-6); max-width: 72rem; margin: 0 auto; }
    section { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--uix-space-3); }
    h1, h2 { overflow-wrap: anywhere; margin: 0; }
    @media print { body { padding: 0; background: none; } }
  </style>
</head>
<body>
  <main id="root"><p>Loading the harness…</p></main>
  <script type="module" src="dist/harness.js"></script>
</body>
</html>
