<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sticky-layer focus harness — UIx v2</title>
  <!-- Test harness for tests/a11y/sticky-focus.spec.mjs (WCAG 2.2 SC 2.4.11 Focus Not Obscured).
       ?scene=page|shell|virtual, &layers=0 shows no toasts and no task tray. Offline: no external assets. -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        var t = q.get('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (q.get('motion') === 'reduce') document.documentElement.setAttribute('data-motion', 'reduce');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../../packages/tokens/build/css/styles.css">
  <style>
    body { margin: 0; background: var(--uix-bg-app); color: var(--uix-text); }
    #root[data-scene="page"], #root[data-scene="virtual"] { display: grid; gap: var(--uix-space-3); max-width: 72rem; margin: 0 auto; padding: var(--uix-space-4); }
    #root[data-scene="virtual"] { padding-bottom: 0; }
    h1 { margin: 0; font-size: var(--uix-text-h2); }
  </style>
</head>
<body>
  <div id="root"><p>Loading the harness…</p></div>
  <script type="module" src="dist/harness.js"></script>
</body>
</html>
