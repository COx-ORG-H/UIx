<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display preferences harness — UIx v2</title>
  <!-- Test harness for tests/a11y/display-preferences.spec.mjs. The first script is
       displayPreferencesScript('uix-harness-display'), written by build.mjs: it runs before the
       stylesheet and the app, as a product's head would. Offline: no external fonts or assets. -->
  <script src="dist/pre-paint.js"></script>
  <link rel="stylesheet" href="../../packages/tokens/build/css/styles.css">
  <style>
    body { margin: 0; padding: var(--uix-space-4); background: var(--uix-bg-app); color: var(--uix-text); }
    main { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--uix-space-6); max-width: 48rem; margin: 0 auto; }
    section { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--uix-space-3); }
  </style>
</head>
<body>
  <main id="root"><p>Loading the harness…</p></main>
  <script type="module" src="dist/harness.js"></script>
</body>
</html>
