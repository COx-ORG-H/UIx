<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modal origin harness — UIx v2</title>
  <!-- Test harness for tests/a11y/modal-origin.spec.mjs (and the recording in record.mjs). Offline: no external fonts or assets. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('uix-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../../packages/tokens/build/css/styles.css">
  <style>
    body { margin: 0; background: var(--uix-bg-app); color: var(--uix-text); }
    main { display: grid; gap: var(--uix-space-4); max-width: 60rem; margin: 0 auto; padding: var(--uix-space-5) var(--uix-space-4); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--uix-space-2); }
    .bar h1 { margin: 0 auto 0 0; font-size: var(--uix-text-h2); }
    .rows { display: grid; gap: var(--uix-space-2); }
    .row { display: flex; align-items: center; gap: var(--uix-space-3); padding: var(--uix-space-3); border: 1px solid var(--uix-border); border-radius: var(--uix-radius-md); background: var(--uix-surface); }
    .row span { flex: 1; }
  </style>
</head>
<body>
  <main id="root"><p>Loading the harness…</p></main>
  <script type="module" src="dist/harness.js"></script>
</body>
</html>
