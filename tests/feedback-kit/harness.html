<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>State feedback kit harness — UIx v2</title>
  <!-- Test harness for tests/a11y/feedback-kit.spec.mjs. Offline: no external fonts or assets. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('uix-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../../packages/tokens/build/css/styles.css">
  <style>
    body { margin: 0; padding: var(--uix-space-4); background: var(--uix-bg-app); color: var(--uix-text); }
    main { display: grid; gap: var(--uix-space-6); }
    section { display: grid; gap: var(--uix-space-3); min-width: 0; }
    section { max-width: 48rem; }
    section > .uix-btn, #latency { justify-self: start; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

  </style>
</head>
<body>
  <main id="root"><p>Loading the harness…</p></main>
  <script type="module" src="dist/harness.js"></script>
</body>
</html>
