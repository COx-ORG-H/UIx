<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serbian italic check — UIx v2</title>
  <!-- The Serbian italic check of tests/a11y/serbian-italic.spec.mjs (roadmap #20). Serbian and
       Macedonian write italic б г д п т differently from Russian; a font carries those forms as an
       OpenType `locl` substitution that the browser applies when the text is tagged lang="sr".
       Each pair sets one letter in one face twice, as Russian and as Serbian (sr-Cyrl); the spec compares
       the two renderings pixel for pixel.

       The kit fonts (Inter, IBM Plex Sans) come from Google Fonts with their italic faces, as a product
       would load them: the kit itself ships no @font-face. `inter-upright` is the upright face, and
       `fallback-italic` the system italic, the control that shows the browser applies locl at all. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;1,400;1,600&family=Inter:ital,wght@0,400;1,400;1,600&display=block" rel="stylesheet">
  <style>
    body { margin: 0; padding: 16px; background: #fff; color: #000; font: 13px/1.4 system-ui, sans-serif; }
    table { border-collapse: collapse; }
    td, th { padding: 2px 10px; text-align: start; }
    /* a fixed, whole-pixel box per letter, so both spans start at the same sub-pixel phase */
    [data-lang] { display: inline-block; inline-size: 64px; text-align: center; font-size: 48px; line-height: 1.25; }
  </style>
</head>
<body>
  <main>
    <h1>Serbian italic: бгдпт</h1>
    <table><tbody id="grid"></tbody></table>
  </main>
  <script>
    /* face: what to set; family/style/weight go on both spans of a pair. */
    window.FACES = [
      { id: 'inter-italic', family: '"Inter"', style: 'italic', weight: 400 },
      { id: 'inter-italic-600', family: '"Inter"', style: 'italic', weight: 600 },
      { id: 'plex-italic', family: '"IBM Plex Sans"', style: 'italic', weight: 400 },
      { id: 'plex-italic-600', family: '"IBM Plex Sans"', style: 'italic', weight: 600 },
      { id: 'inter-upright', family: '"Inter"', style: 'normal', weight: 400 },
      { id: 'fallback-italic', family: 'system-ui, sans-serif', style: 'italic', weight: 400 },
    ];
    window.LETTERS = ['б', 'г', 'д', 'п', 'т'];
    const grid = document.getElementById('grid');
    for (const face of window.FACES) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<th scope="row">${face.id}</th>`;
      for (const letter of window.LETTERS) {
        const td = document.createElement('td');
        td.dataset.pair = `${face.id}:${letter}`;
        for (const [lang, tag] of [['ru', 'ru'], ['sr', 'sr-Cyrl']]) {
          const span = document.createElement('span');
          span.dataset.lang = lang;
          span.lang = tag;
          span.textContent = letter;
          span.style.fontFamily = face.family;
          span.style.fontStyle = face.style;
          span.style.fontWeight = String(face.weight);
          td.append(span);
        }
        tr.append(td);
      }
      grid.append(tr);
    }
  </script>
</body>
</html>
